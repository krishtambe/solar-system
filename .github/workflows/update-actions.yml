name: Check for outdated GitHub Actions

on:
  push

permissions:
  contents: write
  pull-requests: write

jobs:
  check-actions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install actions-up
        run: npm install -g actions-up

      - name: Check for outdated actions
        id: check
        run: |
          actions-up --dry-run > actions-up-raw.txt 2>&1 || true
          if grep -q "→" actions-up-raw.txt; then
            echo "updates-found=true" >> $GITHUB_OUTPUT
          else
            echo "updates-found=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-update workflow files
        if: steps.check.outputs['updates-found'] == 'true'
        run: actions-up --yes

      - name: Commit changes
        if: steps.check.outputs['updates-found'] == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout -b gha-updates-${{ github.run_id }}
          git add .github/workflows || true

          if git diff --cached --quiet; then
            echo "No updates."
            exit 0
          fi

          git commit -m "chore: update outdated GitHub Actions"

      - name: Push branch with PAT
        if: steps.check.outputs['updates-found'] == 'true'
        run: |
          git push https://${{ secrets.ACTIONS_UPDATE_PAT }}@github.com/${{ github.repository }} HEAD:gha-updates-${{ github.run_id }}

      - name: Create Pull Request
        if: steps.check.outputs['updates-found'] == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: gha-updates-${{ github.run_id }}
          title: "chore: update outdated GitHub Actions"
          body: "Automated update using actions-up."
