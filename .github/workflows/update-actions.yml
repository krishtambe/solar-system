name: Check for outdated GitHub Actions

on:
  push:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install actions-up
        run: npm install -g actions-up

      - name: Check for outdated actions
        id: check
        run: |
          actions-up --dry-run > actions-up-raw.txt 2>&1 || true

          if grep -q "→" actions-up-raw.txt; then
            echo "updates-found=true" >> $GITHUB_OUTPUT
          else
            echo "updates-found=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-update workflow files
        if: steps.check.outputs['updates-found'] == 'true'
        run: npx actions-up --yes

      - name: Configure Git user
        if: steps.check.outputs['updates-found'] == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Create update branch
        if: steps.check.outputs['updates-found'] == 'true'
        run: |
          UPDATE_BRANCH="gha-updates-${{ github.run_id }}"
          echo "UPDATE_BRANCH=$UPDATE_BRANCH" >> $GITHUB_ENV
          git checkout -b "$UPDATE_BRANCH"

      - name: Commit changes
        if: steps.check.outputs['updates-found'] == 'true'
        run: |
          git add .github/workflows || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update outdated GitHub Actions"

      - name: Push branch using Classic PAT
        if: steps.check.outputs['updates-found'] == 'true'
        run: |
          git push \
            "https://${{ secrets.PAT_CLASSIC }}@github.com/${{ github.repository }}" \
            HEAD:${UPDATE_BRANCH}

      - name: Create Pull Request
        if: steps.check.outputs['updates-found'] == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ env.UPDATE_BRANCH }}
          title: "chore: update outdated GitHub Actions"
          body: "Automated update using actions-up."
          token: ${{ secrets.PAT_CLASSIC }}
